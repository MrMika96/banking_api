name: Django Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      # Замените Redis на Valkey
      valkey:
        image: valkey/valkey:9.0.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          pip install uv

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt

      - name: Install dev dependencies
        run: |
          uv pip install --system -r requirements.dev.txt

      - name: Create .env from example
        run: |
          cp .env.example .env
          echo "SECRET_KEY=test-key-github-actions" >> .env
          echo "DEBUG=True" >> .env
          echo "LOCAL=True" >> .env
          echo "DB_NAME=test_db" >> .env
          echo "DB_USER=postgres" >> .env
          echo "DB_PASSWORD=postgres" >> .env
          echo "DB_HOST=localhost" >> .env
          echo "DB_PORT=5432" >> .env
          echo "REDIS_HOST=localhost" >> .env
          echo "REDIS_PORT=6379" >> .env
          echo "REDIS_URL=redis://localhost:6379" >> .env

      - name: Wait for Valkey to be ready
        run: |
          sudo apt-get update && sudo apt-get install -y valkey-tools
          for i in {1..10}; do
            if valkey-cli -h localhost -p 6379 ping; then
              echo "Valkey is ready"
              break
            fi
            echo "Waiting for Valkey... $i"
            sleep 2
          done

      - name: Run migrations
        run: |
          python manage.py migrate

      - name: Run tests
        run: |
          python manage.py test --verbosity=2